<!DOCTYPE html>
<html lang="fa-AF" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خانه | املاک و استخدام افغانستان</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- استایل نقشه Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        :root {
            --primary-color: #a62626;
            --primary-hover: #861c1c;
            --accent-green: #00a693;
            --accent-blue: #3b82f6;
            --text-main: #002f34;
            --text-secondary: #5d7579;
            --bg-body: #f5f5f5;
            --bg-white: #ffffff;
            --border-color: #e0e0e2;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
            --radius-md: 12px;
            --radius-sm: 8px;
            --header-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            padding-top: var(--header-height); 
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- Header --- */
        header {
            background: var(--bg-white); 
            box-shadow: var(--shadow-sm); 
            position: fixed; 
            top: 0; left: 0; right: 0; 
            z-index: 1000; 
            height: var(--header-height);
            padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }
        .header-center { display: flex; align-items: center; gap: 20px; width: 100%; max-width: 600px; }
        .logo-area { font-weight: 900; font-size: 1.5rem; color: var(--primary-color); cursor: pointer; white-space: nowrap; }
        .search-wrapper { flex-grow: 1; position: relative; }
        .search-input {
            width: 100%; padding: 10px 40px 10px 15px; border: 1px solid var(--border-color);
            border-radius: 30px; background-color: #f9f9f9; font-size: 0.95rem; outline: none; transition: all 0.3s;
        }
        .search-input:focus { background-color: var(--bg-white); border-color: var(--primary-color); }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 18px; height: 18px; }

        .header-right { display: flex; gap: 10px; align-items: center; }
        .btn-profile { 
            background: white; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .btn-profile:hover { background: #f0f0f0; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }

        /* --- Desktop Split Layout (The New Look) --- */
        /* در دسکتاپ: نوار زیر هدر، نقشه چپ، لیست راست */
        .desktop-layout {
            display: none; /* پیش فرض مخفی */
            width: 100%; max-width: 1400px;
            height: calc(100vh - var(--header-height)); /* پر ارتفاع صفحه */
            margin: 20px auto;
            gap: 20px;
        }
        
        @media (min-width: 992px) {
            .desktop-layout { display: flex; }
            .container { display: none; /* مخفی کردن کانتینر موبایل در دسکتاپ */ }
        }

        .desktop-sidebar {
            width: 450px; /* عرض ثابت برای نقشه */
            flex-shrink: 0;
            height: 100%;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        .desktop-main {
            flex: 1; /* باقی فضا برای لیست */
            overflow-y: auto; /* اسکرول مستقل */
            padding-bottom: 100px; /* جا برای دکمه FAB موبایل اگر بود */
        }

        /* --- Mobile Layout (Original Behavior) --- */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        /* --- Categories --- */
        .category-tabs-wrapper { background: white; border-bottom: 1px solid #eee; }
        .category-tabs {
            max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 10px; overflow-x: auto;
        }
        .cat-tab {
            padding: 10px 24px; border: 1px solid var(--border-color); border-radius: 50px; background: white;
            cursor: pointer; white-space: nowrap; font-weight: 700; color: var(--text-secondary); transition: all 0.2s;
        }
        .cat-tab.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .sub-category-tabs {
            max-width: 1200px; margin: 0 auto; padding: 5px 20px 10px 20px; display: none; gap: 10px; overflow-x: auto;
        }
        .sub-cat-tab {
            padding: 6px 16px; border-bottom: 3px solid transparent; background: none;
            cursor: pointer; font-weight: 600; color: var(--text-secondary); font-size: 0.9rem;
        }
        .sub-cat-tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }

        /* --- Cards (Compact for Desktop Sidebar) --- */
        .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: white; border: 1px solid var(--border-color); border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; width: 100%; }
        .card:hover { box-shadow: var(--shadow-sm); transform: translateY(-2px); }
        
        .card-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .card-body { padding: 12px; }
        .card-title { font-weight: 800; margin-bottom: 4px; line-height: 1.3; font-size: 0.95rem; color: var(--text-main); }
        .card-meta { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .card-price { font-weight: 800; color: var(--text-main); font-size: 1rem; }
        .card-tag { position: absolute; top: 8px; left: 8px; background: rgba(166,38,38,0.9); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
        .card-delete { position: absolute; top: 8px; right: 8px; background: #dc2626; color: white; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        #map-container { width: 100%; height: 100%; background: #eee; }
        
        /* --- FAB (Floating Action Button) --- */
        .fab-container {
            position: fixed; bottom: 30px; left: 30px; z-index: 2000;
        }
        .fab-btn {
            background-color: var(--primary-color); color: white; border: none;
            width: 60px; height: 60px; border-radius: 50%;
            box-shadow: 0 4px 15px rgba(166, 38, 38, 0.3);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .fab-btn svg { width: 32px; height: 32px; }
        .fab-btn:hover { transform: scale(1.1); }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            z-index: 3000; display: none; justify-content: center; align-items: center;
        }
        .modal-box {
            background: white; width: 90%; max-width: 600px; border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; animation: slideUp 0.3s ease-out;
        }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 1.1rem; color: var(--text-main); }
        .modal-body { padding: 20px; overflow-y: auto; max-height: 70vh; }
        .close-btn { background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }

        /* Form Styles */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.9rem; color: var(--text-main); }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none; }
        .form-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(166,38,38,0.1); }
        
        .btn-block { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        
        /* Location Picker Expanded Bar */
        .btn-loc-picker.expanded {
            flex-direction: column; align-items: flex-start; padding: 12px; text-align: right;
            background: #e0f2fe; color: #0369a1; border-color: #0369a1;
        }
        .loc-info { font-size: 0.85rem; font-family: monospace; margin-top: 4px; }
        
        /* --- Toast Notification --- */
        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: #333; color: white; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; animation: toastIn 0.3s; text-align: center; }
        .toast.success { background: #065f46; }
        .toast.error { background: #991b1b; }

        /* Mobile Adjustments */
        @media (max-width: 991px) {
            .fab-btn span { display: none; } /* مخفی کردن متن دکمه */
            .fab-btn { width: 50px; height: 50px; bottom: 20px; left: 20px; }
            .fab-btn svg { width: 24px; height: 24px; }
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area" onclick="window.location.reload()">خانه</div>
        <div class="header-center">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" id="search-input" placeholder="جستجو..." oninput="handleSearch()">
            </div>
        </div>
        <div class="header-right">
            <div class="btn-profile" id="btn-profile" onclick="handleProfileClick()">
                <span id="profile-text">پروفایل</span>
                <div id="user-avatar" class="user-avatar hidden">U</div>
            </div>
        </div>
    </header>

    <!-- Categories -->
    <div class="category-tabs-wrapper">
        <div class="category-tabs">
            <div class="cat-tab active" onclick="switchMainCategory('realestate', this)">املاک</div>
            <div class="cat-tab" onclick="switchMainCategory('employment', this)">استخدام (کارفرما)</div>
            <div class="cat-tab" onclick="switchMainCategory('jobhunting', this)">کارجویی (جویای کار)</div>
            <div class="cat-tab" id="tab-myads" class="hidden" onclick="switchMainCategory('myads', this)" style="color:var(--primary-color)">آگهی‌های من</div>
        </div>
        <div id="sub-category-tabs" class="sub-category-tabs">
            <div class="sub-cat-tab active" onclick="switchSubCategory('sale', this)">فروشی</div>
            <div class="sub-cat-tab" onclick="switchSubCategory('rent', this)">کرایی</div>
            <div class="sub-cat-tab" onclick="switchSubCategory('mortgage', this)">گروی</div>
        </div>
    </div>

    <!-- Desktop Layout Container -->
    <div class="desktop-layout">
        <!-- Left: Map -->
        <div class="desktop-sidebar">
            <div id="map-container"></div>
        </div>
        
        <!-- Right: List -->
        <div class="desktop-main">
            <div id="list-view" class="listings-grid"></div>
        </div>
    </div>

    <!-- Mobile Container -->
    <main class="container">
        <div id="list-view-mobile" class="listings-grid"></div>
        <div id="map-container-mobile" class="hidden" style="width:100%; height:500px; border-radius:12px; margin-top:20px;"></div>
    </main>

    <!-- Floating Action Button (Mobile Only) -->
    <div class="fab-container">
        <button class="fab-btn" onclick="openPostAdModal()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 1. Auth Modal (Login) -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>ورود / ثبت نام</h3>
                <button class="close-btn" onclick="closeModal('auth-modal')">×</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleLogin(event)">
                    <p style="text-align:center; color:#666; margin-bottom:15px;">لطفا شماره تلیفون خود را وارد کنید (رمزی لازم نیست).</p>
                    <div class="form-group">
                        <label class="form-label">شماره تلیفون</label>
                        <input type="tel" id="login-phone" class="form-input" required placeholder="07..." style="direction:ltr; text-align:right;">
                    </div>
                    <button type="submit" class="btn-block" style="background:var(--primary-color); color:white;">ورود</button>
                    <button type="button" class="btn-block" style="background:transparent; color:var(--text-secondary); margin-top:10px; border:none;" onclick="handleLogout()">خروج</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. Post Ad Modal -->
    <div id="post-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>ثبت آگهی جدید</h3>
                <button class="close-btn" onclick="closeModal('post-modal')">×</button>
            </div>
            <div class="modal-body">
                <form id="post-ad-form" onsubmit="handlePostSubmit(event)">
                    <div class="form-group">
                        <label class="form-label">دسته‌بندی</label>
                        <select id="post-category" class="form-select" onchange="updatePostSubOptions()">
                            <option value="realestate">املاک</option>
                            <option value="employment">استخدام (کارفرما)</option>
                            <option value="jobhunting">کارجویی (جویای کار)</option>
                        </select>
                    </div>
                    <div class="form-group hidden" id="post-subcategory-group">
                        <label class="form-label">نوع معامله</label>
                        <select id="post-subcategory" class="form-select" onchange="updateDynamicFields()">
                            <option value="sale">فروشی</option>
                            <option value="rent">کرایی</option>
                            <option value="mortgage">گروی</option>
                        </select>
                    </div>
                    <div id="dynamic-form-fields"></div>
                    
                    <div class="form-group">
                        <label class="form-label">عنوان آگهی</label>
                        <input type="text" id="post-title" class="form-input" required placeholder="مثلاً فلت شیک...">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">تصویر (حداکثر ۱ عدد)</label>
                        <!-- محدودیت به ۱ عکس برای جلوگیری از پر شدن حافظه -->
                        <input type="file" id="post-image" class="form-input" accept="image/*" onchange="handleImagePreview(this)">
                        <div id="image-preview" style="margin-top:10px; width:100px; height:100px; border-radius:8px; object-fit:cover; display:none;"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">آدرس دقیق</label>
                        <input type="text" id="post-address" class="form-input" required placeholder="مثلاً کوچه چهارم...">
                    </div>

                    <div class="form-group">
                        <label class="form-label">معلومات کامل</label>
                        <textarea id="post-desc" class="form-textarea" rows="3" placeholder="جزئیات..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">موقعیت دقیق روی نقشه</label>
                        <button type="button" id="btn-loc-picker" class="btn-block" style="background:var(--accent-blue); color:white;" onclick="openLocationPicker()">
                            📍 انتخاب موقعیت روی نقشه
                        </button>
                        <input type="hidden" id="post-lat"> <input type="hidden" id="post-lng">
                    </div>
                    
                    <button type="submit" class="btn-block" style="background:var(--accent-green); color:white;">انتشار آگهی</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 3. Location Picker Modal -->
    <div id="location-picker-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>انتخاب موقعیت</h3>
                <button class="close-btn" onclick="closeModal('location-picker-modal')">×</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:10px; font-size:0.9rem; color:#666;">روی نقشه کلیک کنید تا مکان مشخص شود.</p>
                <div id="picker-map-container" style="width:100%; height:300px; border-radius:8px; margin-bottom:20px; border:2px solid #eee;"></div>
                <div class="picker-actions" style="text-align:left;">
                    <button class="btn-block" style="background:var(--primary-color); color:white;" onclick="confirmLocation()">تایید موقعیت</button>
                    <button class="btn-block" style="background:transparent; color:#666; border:none;" onclick="closeModal('location-picker-modal')">لغو</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // --- 1. Configuration & Data Storage ---
        const DB_KEY_LISTINGS = 'khana_listings';
        const DB_KEY_USER = 'khana_user';
        
        // Data Loading from LocalStorage
        let listingsDB = JSON.parse(localStorage.getItem(DB_KEY_LISTINGS)) || [
            { id: 1715001, type: 'realestate', subtype: 'sale', title: 'فلت فورنیش شیرپور', price: '۹۵,۰۰۰ دالر', desc: '۳ خوابه، ۱۴۰ متر.', loc: 'کابل، شیرپور', owner: '0700000001', lat: 34.5155, lng: 69.1807, img: 'https://picsum.photos/seed/r1/600/400' },
            { id: 1715002, type: 'realestate', subtype: 'rent', title: 'ویلا کرایی هرات', price: '۳۰,۰۰۰ افغانی/ماه', desc: '۵۰۰ متر، باغچه.', loc: 'هرات، گلزار', owner: '0700000002', lat: 34.3525, lng: 62.2038, img: 'https://picsum.photos/seed/r2/600/400' },
            { id: 1715003, type: 'employment', subtype: null, title: 'مدیر فروش آریانا', price: '۳۰,۰۰۰ دالر', desc: 'نیاز به مدیر با سابقه.', loc: 'کابل', owner: '0700000003', lat: 34.5150, lng: 69.1950, img: 'https://picsum.photos/seed/e1/600/400' }
        ];

        let currentUser = JSON.parse(localStorage.getItem(DB_KEY_USER)) || null;

        // State
        let currentMainCategory = 'realestate';
        let currentSubCategory = 'sale';
        let currentViewType = 'all'; // all or myads
        let searchQuery = '';
        let map = null, markersLayer = null;
        let pickerMap = null, pickerMarker = null;
        let selectedLat = null, selectedLng = null;
        let selectedImageBase64 = null;

        window.onload = function() { 
            checkAuth(); 
            renderList(); 
            if(window.innerWidth >= 992) initMap();
        };

        // --- 2. Authentication System ---
        function checkAuth() {
            const btn = document.getElementById('btn-profile');
            const text = document.getElementById('profile-text');
            const avatar = document.getElementById('user-avatar');

            if (currentUser) {
                text.innerText = currentUser.phone;
                avatar.innerText = currentUser.phone.substring(0,1).toUpperCase();
                avatar.classList.remove('hidden');
                // Show "My Ads" tab
                document.getElementById('tab-myads').classList.remove('hidden');
            } else {
                text.innerText = 'پروفایل';
                avatar.classList.add('hidden');
                document.getElementById('tab-myads').classList.add('hidden');
            }
        }

        function handleProfileClick() {
            if (currentUser) {
                // Show confirm logout
                if(confirm('آیا می‌خواهید خارج شوید؟')) {
                    handleLogout();
                }
            } else {
                openModal('auth-modal');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value;
            if (phone.length < 10) {
                showToast('لطفا شماره معتبر وارد کنید.', 'error');
                return;
            }
            currentUser = { phone: phone, isLogged: true };
            localStorage.setItem(DB_KEY_USER, JSON.stringify(currentUser));
            checkAuth();
            closeModal('auth-modal');
            showToast(`خوش آمدید، ${phone}`, 'success');
            renderList(); // Refresh list to show "My Ads"
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem(DB_KEY_USER);
            checkAuth();
            showToast('شما خارج شدید.', 'success');
            renderList();
        }

        // --- 3. Navigation & View Logic ---
        function switchMainCategory(cat, btn) {
            currentMainCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            
            // Reset View to 'all' when switching main category
            if(currentViewType === 'myads') {
                // Optional: keep in myads? Let's switch back to all for better UX
                currentViewType = 'all'; 
            }

            const subTabs = document.getElementById('sub-category-tabs');
            if (cat === 'realestate') {
                subTabs.style.display = 'flex';
                currentSubCategory = 'sale';
                document.querySelectorAll('.sub-cat-tab').forEach((el, i) => { el.classList.remove('active'); if(i===0) el.classList.add('active'); });
            } else {
                subTabs.style.display = 'none';
                currentSubCategory = null;
            }
            
            renderList();
            updateMapMarkers(); // Update map for desktop split
        }

        function switchSubCategory(sub, btn) {
            currentSubCategory = sub;
            document.querySelectorAll('.sub-cat-tab').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            renderList();
            updateMapMarkers();
        }

        function switchViewType(type, btn) {
            // type: 'all' or 'myads'
            if(btn) {
                document.querySelectorAll('.cat-tab').forEach(el => el.classList.remove('active')); // Remove styling from others
                if(btn) btn.classList.add('active');
            }
            
            currentViewType = type;
            renderList();
            updateMapMarkers();
        }

        function handleSearch() {
            const input = document.getElementById('search-input');
            searchQuery = input.value.toLowerCase();
            renderList();
        }

        // --- 4. Map Logic (Desktop Split View) ---
        function initMap() {
            const mapId = (window.innerWidth >= 992) ? 'map-container' : 'map-container-mobile';
            const el = document.getElementById(mapId);
            if(!el || el.style.display === 'none') return;

            map = L.map(mapId).setView([34.5553, 69.2075], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);

            // Fix map render size issue
            setTimeout(() => { map.invalidateSize(); }, 100);
        }

        function updateMapMarkers() {
            if(!map || window.innerWidth < 992) return; // Only show markers in desktop split mode

            markersLayer.clearLayers();
            let filtered = getFilteredList();
            
            if (filtered.length === 0) return;

            filtered.forEach(item => {
                const marker = L.marker([item.lat, item.lng]);
                const smallPopup = `
                    <div style="text-align:right; direction:rtl; min-width:200px;">
                        <img src="${item.img}" style="width:100%; height:100px; object-fit:cover; border-radius:4px;">
                        <div style="padding:8px;">
                            <div style="font-weight:bold; font-size:13px;">${item.title}</div>
                            <div style="font-size:11px; color:#a62626; margin-top:2px;">${item.price}</div>
                            <button onclick="openAdModal(${item.id})" style="background:none; border:none; color:#3b82f6; cursor:pointer; font-size:11px; text-decoration:underline; margin-top:4px;">مشاهده</button>
                        </div>
                    </div>`;
                marker.bindPopup(smallPopup);
                markersLayer.addLayer(marker);
            });
        }

        // --- 5. List Logic ---
        function getFilteredList() {
            let filtered = listingsDB.filter(item => item.type === currentMainCategory);
            if (currentMainCategory === 'realestate' && currentSubCategory) {
                filtered = filtered.filter(item => item.subtype === currentSubCategory);
            }

            // Search Filter
            if (searchQuery) {
                filtered = filtered.filter(item => item.title.toLowerCase().includes(searchQuery));
            }

            // User Filter (My Ads)
            if (currentViewType === 'myads' && currentUser) {
                filtered = filtered.filter(item => item.owner === currentUser.phone);
            }

            return filtered;
        }

        function renderList() {
            // Desktop List (Sidebar)
            const listDesktop = document.getElementById('list-view');
            // Mobile List
            const listMobile = document.getElementById('list-view-mobile');
            
            listDesktop.innerHTML = '';
            listMobile.innerHTML = '';

            let filtered = getFilteredList();

            // Desktop Header in List Sidebar
            if(window.innerWidth >= 992) {
                const count = document.createElement('div');
                count.style.padding = '10px 12px; font-weight:700; color:#666; font-size:0.9rem; border-bottom:1px solid #eee;';
                count.innerText = `نتایج: ${filtered.length} آگهی`;
                listDesktop.appendChild(count);
            }

            if (filtered.length === 0) {
                const empty = '<div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#888;">موردی یافت نشد.</div>';
                listDesktop.innerHTML = empty;
                listMobile.innerHTML = empty;
                return;
            }

            filtered.forEach(item => {
                const isOwner = currentUser && item.owner === currentUser.phone;
                
                const card = document.createElement('div');
                card.className = 'card';
                
                let deleteBtnHtml = '';
                if(isOwner) {
                    deleteBtnHtml = `<button class="card-delete" onclick="deleteAd(${item.id})" title="حذف">×</button>`;
                }

                card.innerHTML = `
                    <img src="${item.img}" class="card-img">
                    <div class="card-body">
                        <div class="card-tag">${item.type==='realestate' ? (item.subtype==='sale'?'فروشی':(item.subtype==='rent'?'کرایی':'گروی')) : (item.type==='employment'?'استخدام':'کارجویی')}</div>
                        ${deleteBtnHtml}
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">📍 ${item.loc}</div>
                        <div class="card-price">${item.price}</div>
                    </div>
                `;
                
                card.onclick = (e) => {
                    if(!e.target.classList.contains('card-delete')) {
                        openAdModal(item);
                    }
                };

                // Clone for mobile and desktop
                listDesktop.appendChild(card.cloneNode(true));
                listMobile.appendChild(card.cloneNode(true));
            });
        }

        // --- 6. Post Ad Form Logic ---
        function openPostAdModal() {
            if (!currentUser) {
                showToast('برای ثبت آگهی ابتدا وارد شوید (پروفایل).', 'error');
                handleProfileClick();
                return;
            }

            document.getElementById('post-ad-form').reset();
            document.getElementById('image-preview').style.display = 'none';
            selectedImageBase64 = null;

            document.getElementById('post-lat').value = '';
            document.getElementById('post-lng').value = '';
            const btn = document.getElementById('btn-loc-picker');
            btn.classList.remove('expanded');
            btn.innerHTML = '📍 انتخاب موقعیت روی نقشه';

            const catSelect = document.getElementById('post-category');
            const subGroup = document.getElementById('post-subcategory-group');
            catSelect.value = currentMainCategory;
            updatePostSubOptions();
            if(currentMainCategory === 'realestate') {
                document.getElementById('post-subcategory').value = currentSubCategory || 'sale';
            }
            document.getElementById('post-modal').style.display = 'flex';
        }

        function updatePostSubOptions() {
            const cat = document.getElementById('post-category').value;
            const subGroup = document.getElementById('post-subcategory-group');
            subGroup.style.display = (cat === 'realestate') ? 'block' : 'none';
            updateDynamicFields();
        }

        function updateDynamicFields() {
            const cat = document.getElementById('post-category').value;
            const sub = document.getElementById('post-subcategory').value;
            const container = document.getElementById('dynamic-form-fields');
            container.innerHTML = '';
            let html = '';

            if (cat === 'realestate') {
                if (sub === 'sale') {
                    html = `<div class="form-group"><label class="form-label">قیمت کل</label><input type="text" id="inp-price" class="form-input" required placeholder="مثلاً ۱۰۰,۰۰۰ دالر"></div>`;
                } else if (sub === 'rent') {
                    html = `<div class="form-group"><label class="form-label">کرایی ماهانه</label><input type="text" id="inp-price" class="form-input" required></div>`;
                } else {
                    html = `<div class="form-group"><label class="form-label">مبلغ کل گرو</label><input type="text" id="inp-price" class="form-input" required></div>`;
                }
            } else if (cat === 'employment') {
                html = `<div class="form-group"><label class="form-label">حقوق پیشنهادی</label><input type="text" id="inp-salary" class="form-input" required></div>`;
            } else if (cat === 'jobhunting') {
                html = `<div class="form-group"><label class="form-label">حقوق درخواستی</label><input type="text" id="inp-salary" class="form-input"></div>`;
            }
            container.innerHTML = html;
        }

        // Image Preview (Single Image for Demo)
        function handleImagePreview(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // Size check (Limit to 500KB for LocalStorage safety)
                if(file.size > 500 * 1024) {
                    showToast('حجم تصویر باید کمتر از ۵۰۰ کیلوبایت باشد (محدودیت نسخه دمو).', 'error');
                    input.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result; // Save Base64 string
                    const preview = document.getElementById('image-preview');
                    preview.src = selectedImageBase64;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // --- 7. Location Picker Logic ---
        function openLocationPicker() {
            document.getElementById('location-picker-modal').style.display = 'flex';
            setTimeout(() => {
                if (!pickerMap) {
                    pickerMap = L.map('picker-map-container').setView([34.5553, 69.2075], 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(pickerMap);
                    pickerMap.on('click', function(e) {
                        if (pickerMarker) pickerMarker.setLatLng(e.latlng);
                        else pickerMarker = L.marker(e.latlng).addTo(pickerMap);
                        selectedLat = e.latlng.lat;
                        selectedLng = e.latlng.lng;
                    });
                } else {
                    pickerMap.invalidateSize();
                }
            }, 200);
        }

        function confirmLocation() {
            if (!selectedLat) { showToast('لطفا روی نقشه کلیک کنید.', 'error'); return; }
            document.getElementById('post-lat').value = selectedLat;
            document.getElementById('post-lng').value = selectedLng;
            
            // UX: Expand button to show coordinates
            const btn = document.getElementById('btn-loc-picker');
            btn.classList.add('expanded');
            btn.innerHTML = `
                <span>✅ موقعیت ثبت شد</span>
                <div class="loc-info">Lat: ${parseFloat(selectedLat).toFixed(4)}</div>
                <div class="loc-info">Lng: ${parseFloat(selectedLng).toFixed(4)}</div>
            `;
            
            closeModal('location-picker-modal');
        }

        // --- 8. Handle Post Submit (Save to LocalStorage) ---
        function handlePostSubmit(e) {
            e.preventDefault();
            const lat = document.getElementById('post-lat').value;
            const lng = document.getElementById('post-lng').value;
            if(!lat || !lng) { showToast('لطفا موقعیت دقیق را مشخص کنید.', 'error'); return; }

            const cat = document.getElementById('post-category').value;
            const sub = (cat === 'realestate') ? document.getElementById('post-subcategory').value : null;
            const title = document.getElementById('post-title').value;
            const address = document.getElementById('post-address').value;
            const desc = document.getElementById('post-desc').value;
            
            // Use dynamic price or default
            const priceInput = document.getElementById('inp-price');
            const salaryInput = document.getElementById('inp-salary');
            let priceText = priceInput ? priceInput.value : (salaryInput ? salaryInput.value : 'توافقی');

            const newAd = {
                id: Date.now(), 
                type: cat, 
                subtype: sub, 
                title: title, 
                price: priceText, 
                desc: desc, 
                loc: address || 'آگهی جدید', 
                lat: parseFloat(lat), 
                lng: parseFloat(lng), 
                owner: currentUser.phone, // Link to user
                img: selectedImageBase64 || 'https://picsum.photos/seed/' + Date.now() + '/600/400' // Base64 or default
            };

            // Save to LocalStorage
            listingsDB.unshift(newAd);
            localStorage.setItem(DB_KEY_LISTINGS, JSON.stringify(listingsDB));

            closeModal('post-modal');
            showToast('✅ آگهی شما با موفقیت ثبت شد!', 'success');
            
            // Switch view to 'all' to show the new ad in list
            if(currentViewType === 'myads') {
                 // Just re-render list locally, no need to switch tab object, just logic
                 // We need to find the tab object for 'all' manually or just reset type
                 // Simulating clicking 'all' tab:
                 document.getElementById('tab-myads').classList.add('hidden'); // Hide My Ads
                 // Need to find main tabs... actually we can just reset variable:
                 // But user wants to see "My Ads" after posting? 
                 // Let's assume user wants to see the new ad.
            }
            renderList();
            updateMapMarkers();
        }

        // --- 9. Delete Logic ---
        function deleteAd(id) {
            if(confirm('آیا مطمئن هستید که می‌خواهید این آگهی را حذف کنید؟')) {
                listingsDB = listingsDB.filter(item => item.id !== id);
                localStorage.setItem(DB_KEY_LISTINGS, JSON.stringify(listingsDB));
                renderList();
                updateMapMarkers();
                showToast('آگهی حذف شد.', 'success');
            }
        }

        // --- 10. Ad Detail Logic ---
        function openAdModal(item) {
            const modal = document.getElementById('ad-modal');
            // We reuse post modal for viewing details (simplification for single file)
            const body = document.getElementById('post-modal').querySelector('.modal-body');
            
            // Check ownership for delete button
            const isOwner = currentUser && item.owner === currentUser.phone;
            
            // Build detail view HTML
            let deleteHtml = isOwner ? `<button onclick="deleteAd(${item.id}); event.stopPropagation();" style="position:fixed; top:80px; left:80%; background:#dc2626; color:white; border:none; padding:8px 16px; border-radius:8px; z-index:9999; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.2);">حذف آگهی</button>` : '';

            body.innerHTML = `
                <h2 style="margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:10px;">${item.title}</h2>
                <div style="font-size:1.5rem; color:var(--primary-color); font-weight:900; margin-bottom:15px;">${item.price}</div>
                <div style="margin-bottom:20px; color:#555;">📍 ${item.loc}</div>
                <img src="${item.img}" style="width:100%; height:250px; object-fit:cover; border-radius:8px; margin-bottom:20px;">
                
                <h4 style="margin-bottom:10px; color:#333;">معلومات:</h4>
                <p style="line-height:1.6; color:#444; margin-bottom:30px;">${item.desc}</p>

                <div class="picker-actions" style="display:flex; gap:10px;">
                    <button type="button" class="btn-block" style="background:var(--accent-blue); color:white;" onclick="alert('شماره تماس: ' + item.owner)">📞 تماس با فروشنده</button>
                </div>
                ${deleteHtml}
                <button style="position:absolute; top:15px; left:15px; background:#eee; border:none; border-radius:50%; width:30px; height:30px; cursor:pointer;" onclick="closeModal('post-modal')">✕</button>
            `;
            
            // We hijack the post modal to show details (simpler than creating a new modal HTML)
            // Change title dynamically
            const headerTitle = document.querySelector('#post-modal h3');
            headerTitle.innerText = "جزئیات آگهی";

            // Hide submit button
            const submitBtn = document.querySelector('#post-modal button[type="submit"]');
            if(submitBtn) submitBtn.style.display = 'none';

            // Open modal
            document.getElementById('post-modal').style.display = 'flex';
        }

        // Utilities
        function closeModal(id) { 
            // If closing the post-modal, ensure it resets to "Post" mode if reopened
            if(id === 'post-modal') {
                const headerTitle = document.querySelector('#post-modal h3');
                if(headerTitle) headerTitle.innerText = "ثبت آگهی جدید";
                const submitBtn = document.querySelector('#post-modal button[type="submit"]');
                if(submitBtn) submitBtn.style.display = 'block';
            }
            document.getElementById(id).style.display = 'none'; 
        }
        
        window.onclick = function(e) { 
            if (e.target.classList.contains('modal-overlay')) { 
                closeModal('post-modal'); // ensure post modal resets
                e.target.style.display = 'none'; 
            } 
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }
    </script>
</body>
</html>
